# Throwaway PostgreSQL for the integration suite.
#
#   docker compose up -d
#   AIDBGATE_TEST_PG_DSN=postgresql://postgres:aidbgate@localhost:55432/aidbgate \
#     PYTHONPATH=src python -m pytest tests/integration -v
#   docker compose down
#
# Or just run scripts/run_pg_integration.sh, which wraps all of this.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: aidbgate
      POSTGRES_DB: aidbgate
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aidbgate"]
      interval: 2s
      timeout: 3s
      retries: 15
